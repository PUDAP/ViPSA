services:
  edge:
    build:
      context: ..
      dockerfile: stage/Dockerfile
    image: ghcr.io/pudap/stage-edge:latest
    container_name: stage-edge
    restart: unless-stopped
    volumes:
      - ./.env:/app/.env:ro
      - ./state:/app/stage/state
    healthcheck:
      test: ["CMD", "uv", "run", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
