services:
  edge:
    build:
      context: ..
      dockerfile: keithley-707b/Dockerfile
    image: ghcr.io/pudap/keithley-707b-edge:latest
    container_name: keithley-707b-edge
    restart: unless-stopped
    volumes:
      - ./.env:/app/.env:ro
    healthcheck:
      test: ["CMD", "uv", "run", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
